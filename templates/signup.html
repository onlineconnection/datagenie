{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card" style="max-width:430px;margin:30px auto">
  <h1 style="font-size:28px">Create your account</h1>
  <p class="sub">It takes a few seconds.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <p><label>Email</label><input type="email" name="email" required></p>
    <p><label>Password (8 or more characters)</label><input type="password" name="password" required minlength="8"></p>
    <button type="submit" style="width:100%">Sign up</button>
  </form>
  <p class="sub" style="margin:16px 0 0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
