{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h1>Create your account</h1>
<div class="card" style="max-width:420px">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <p><label>Email</label><input type="email" name="email" required style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></p>
    <p><label>Password (8+ characters)</label><input type="password" name="password" required minlength="8" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></p>
    <button type="submit">Sign up</button>
  </form>
  <p class="sub" style="margin-top:14px">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
