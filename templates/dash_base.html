{% extends "base.html" %}
{% block content %}
<style>
  main{max-width:1200px}
  .dash{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:start}
  .side a{display:block;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none}
  .side a:hover,.side a.on{background:#eef0f6;font-weight:600}
  .scroll{overflow-x:auto}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:14px}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  input[type=checkbox]{width:auto}
  .del{background:#fef2f2;color:#b42318;padding:6px 10px;font-size:13px}
  .ok{background:#ecfdf3;color:#067647;border:1px solid #abefc6;padding:10px 14px;border-radius:10px;margin-bottom:12px}
  @media(max-width:720px){.dash{grid-template-columns:1fr}}
</style>
<h1>{{ biz.title }}</h1>
<div class="dash">
  <nav class="side card">
    <a href="{{ url_for('dashboard', biz_id=biz.id) }}" class="{{ 'on' if not current }}">Overview</a>
    {% for t in biz.design.tables %}
    <a href="{{ url_for('table_page', biz_id=biz.id, tname=t.name) }}" class="{{ 'on' if current == t.name }}">{{ t.name | pretty }}</a>
    {% endfor %}
    <a href="{{ url_for('view', biz_id=biz.id) }}" target="_blank">View final product ↗</a>
  </nav>
  <section>
    {% for cat, m in get_flashed_messages(with_categories=true) %}
    <div class="{{ 'ok' if cat == 'ok' else 'error' }}">{{ m }}</div>
    {% endfor %}
    {% block panel %}{% endblock %}
  </section>
</div>
{% endblock %}
