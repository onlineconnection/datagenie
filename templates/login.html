{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:430px;margin:30px auto">
  <h1 style="font-size:28px">Welcome back</h1>
  <p class="sub">Log in to manage your databases.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <p><label>Email</label><input type="email" name="email" required></p>
    <p><label>Password</label><input type="password" name="password" required></p>
    <button type="submit" style="width:100%">Log in</button>
  </form>
  <p class="sub" style="margin:16px 0 0">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
