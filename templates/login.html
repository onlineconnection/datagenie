{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<div class="card" style="max-width:420px">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <p><label>Email</label><input type="email" name="email" required style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></p>
    <p><label>Password</label><input type="password" name="password" required style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></p>
    <button type="submit">Log in</button>
  </form>
  <p class="sub" style="margin-top:14px">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
